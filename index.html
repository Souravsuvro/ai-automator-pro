<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Automator Pro — One-Click Business Autopilot for Wix</title>
  <meta name="description" content="AI SaaS for Wix site owners: Business DNA, Wix AI prompts, SEO, FAQ schema for AI search, and automations." />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="canonical" href="https://ai-automator-pro.vercel.app/" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{100:'#ede9fe',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9'}},maxWidth:{dash:'1248px'}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,system-ui,sans-serif}
    .gradient-bg{background:linear-gradient(135deg,#0f172a,#4c1d95)}
    .card-hover{transition:.25s}.card-hover:hover{transform:translateY(-4px);box-shadow:0 20px 40px -12px rgba(124,58,237,.25)}
    .prose-output{white-space:pre-wrap;line-height:1.65}
    .watermark{position:relative}.watermark::after{content:"Free tier · Upgrade for clean export";position:absolute;bottom:12px;right:16px;font-size:11px;color:#94a3b8}
    #main .max-w-6xl,#main .max-w-7xl,#main .max-w-5xl{max-width:1248px}
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
  <div id="app" class="min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b border-slate-200">
      <div class="max-w-dash mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2 cursor-pointer" onclick="App.navigate('home')">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700"></div>
          <span class="font-bold text-lg">AI Automator <span class="text-brand-600">Pro</span></span>
          <span class="text-xs bg-brand-100 text-brand-700 px-2 py-0.5 rounded-full hidden sm:inline">Wix Edition</span>
        </div>
        <nav class="flex items-center gap-3">
          <button onclick="App.navigate('pricing')" class="text-sm text-slate-600 hover:text-brand-600">Pricing</button>
          <button id="btn-dashboard" onclick="App.navigate('dashboard')" class="hidden text-sm text-slate-600">Dashboard</button>
          <div id="tier-badge" class="hidden sm:block text-xs font-semibold px-2 py-1 rounded-full bg-slate-100">Free</div>
          <button id="btn-upgrade" onclick="App.navigate('pricing')" class="text-sm font-semibold bg-brand-600 text-white px-4 py-2 rounded-lg">Upgrade</button>
        </nav>
      </div>
    </header>
    <main id="main" class="flex-1"></main>
    <footer class="border-t bg-white py-8 text-sm text-slate-500">
      <div class="max-w-dash mx-auto px-4 flex flex-col sm:flex-row justify-between gap-3">
        <span><strong class="text-slate-700">AI Automator Pro</strong> · Complements Wix AI — does not replace Marketing Agent</span>
        <div class="flex gap-4 flex-wrap">
          <button onclick="App.navigate('embed')" class="hover:text-brand-600">Embed</button>
          <button onclick="App.navigate('docs')" class="hover:text-brand-600">Help / FAQ</button>
          <a href="/privacy.html" class="hover:text-brand-600">Privacy</a>
          <a href="https://github.com/Souravsuvro/ai-automator-pro" target="_blank" rel="noopener" class="hover:text-brand-600">GitHub</a>
        </div>
      </div>
    </footer>
  </div>
  <div id="toast" class="fixed bottom-6 right-6 z-[100] hidden">
    <div class="bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
      <span id="toast-icon"></span><span id="toast-msg" class="text-sm font-medium"></span>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/generators.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
